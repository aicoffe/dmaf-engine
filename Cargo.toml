[package]
name = "dmaf-engine"
version = "0.7.2"
edition = "2021"
description = "D-MAF deterministic multi-agent routing engine (Rust implementation)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aicoffe/dmaf-engine"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.10"
chrono = "0.4"
include_dir = "0.7"
# market integration (internal guide §4.2, in docs-dev/, not committed): synchronous HTTP (rustls), gzip, tar
ureq = { version = "2.10", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
flate2 = "1"
tar = "0.4"

[[bin]]
name = "dmaf"
path = "src/main.rs"

[lib]
name = "dmaf_engine"

[profile.release]
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# dist release pipeline (D1 decision; artifact naming frozen to dist 0.34 output, see docs-dev plan section 6.1)
# Config for 'dist'
[workspace.metadata.dist]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# CI backends to support
ci = "github"
# Checksums to generate for each App
checksum = "sha256"
# Whether dist should create a Github Release or use an existing draft
create-release = true
# Which actions to run on pull requests
pr-run-mode = "skip"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# Path that installers should place binaries in
install-path = "~/.local/bin/"
# Whether to install an updater program
install-updater = false
# npm channel publishing (D6 esbuild multi-package shape, assembled by npm/build.cjs; see docs-dev plan section 6.5)
# custom publish job -> invokes .github/workflows/npm-publish.yml; prereleases are skipped by dist
# NOTE: after every `dist generate`, re-apply the two hand-fixes to the generated job (guarded in ci.yml):
#   1. `uses: $/...` must read `./...`
#   2. `"contents": "read"` must be added to the job permissions (checkout/gh would fail with 403)
# allow-dirty: dist host verifies the committed release.yml against its own regeneration and refuses
# to run otherwise — the hand-fixes above would always trip that check. Elements are config classes
# to skip the up-to-date check for (enum: "ci" / "msi"; a plain boolean is rejected by the schema);
# ci.yml's template guard is the drift enforcement in its place
allow-dirty = ["ci"]
publish-jobs = ["./npm-publish"]
