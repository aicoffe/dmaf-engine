name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dist 0.34 emits two defects into the generated custom-npm-publish job; both are
      # hand-fixed in the committed file and must be re-applied after every `dist generate`
      # (see Cargo.toml [workspace.metadata.dist] comment)
      - name: Release workflow template guard
        run: |
          if grep -q 'uses: \$/' .github/workflows/release.yml; then
            echo "::error::release.yml has the dist 0.34 'uses: \$/' template bug - fix the line to './.github/workflows/npm-publish.yml'"
            exit 1
          fi
          if ! grep -A16 '^  custom-npm-publish:' .github/workflows/release.yml | grep -q '"contents": "read"'; then
            echo "::error::custom-npm-publish job lost 'contents: read' in permissions - checkout/gh would fail with 403"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Compiled artifact drift check
        run: cargo run --quiet -- compile --check
