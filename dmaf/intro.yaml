# The three intro elements consumed by `dmaf publish --intro` (plain text, no HTML;
# what_it_is / what_it_does up to 2000 characters each, how_to_use up to 4000).
# Values are single-quoted YAML scalars: ASCII ": " inside plain scalars would break parsing.
what_it_is: 'AI-native SDLC standard workflow pack for the D-MAF engine (the engine''s sample workflow). Contains 2 scopes — sdlc-standard (the standard delivery flow) and bugfix (the defect-fix flow; both share one stage library), 12 stages across four phases (concept → requirements → design → development), 8 agents (dmaf-conductor as orchestrator plus seven SDLC roles — product, architecture, frontend, backend, QA, tech lead, UX) and 29 professional skills organized into 12 capability domains (requirements, architecture, frontend, backend, testing, security, observability and operations, governance, engineering, stack binding, D-MAF orchestration, and the organization specification charter layer).'
what_it_does: 'Drives a raw requirement text through an end-to-end software delivery process. The D-MAF engine routes deterministically while the LLM conductor dispatches role subagents exactly as instructed: concept phase captures the intent → requirements phase produces a spec with acceptance criteria → design phase produces, on demand, a high-fidelity coded UI prototype, an architecture impact analysis with a tech-stack declaration, the architecture design (hld), the backend/frontend detailed designs, conflict resolution and design sign-off → development phase produces a plan, decomposes TDD tasks, executes them atomically, runs system testing and prepares the PR. Nine human approval gates pause for your decision: approval proceeds, rejection opens a revision round carrying your revision feedback. High-fidelity UE and hld are on-demand stages (prototype only when a UI exists; for brownfield, trim by the architecture impact conclusion). A separate bugfix scope carries a defect report (ticket/alert/incident) into an intent → a minimal-fix-surface spec (reproduction test turned green) → on-demand design → TDD fix with regression system testing → PR, sharing the same stage library; pure backend fixes skip the UE prototype and hld automatically. Every decision and dispatch lands on an append-only hash-chained audit trail — replayable, forkable, resumable.'
how_to_use: 'Prerequisites: the target project has the dmaf engine installed plus any supported AI harness (opencode/claude/zcode/cursor/gemini/codex/dsh) with a working LLM. Step 1 — in the target project root, run the install command given on the entry page (dmaf add https://dmaf.aicoffe.com/aicoffe/dmaf-sdlc): it completes the dmaf/ standard skeleton, merges the workflow definitions and agent/skill assets, recompiles, and deploys in cascade to the installed harnesses. Step 2 — start the flow: /dmaf start "your requirement description" launches the development process. Step 3 — follow the conductor loop: at an approval gate the command output stops at awaiting-approval; review the deliverables and continue with an approval decision (granted to proceed, rejected to open a revision round with your revision feedback). All deliverables land under dmaf-output/ at the project root (bucketed per session). Common operations: ask /dmaf in natural language for progress, view the log, or fork a branch from a chosen stage to re-run.'
